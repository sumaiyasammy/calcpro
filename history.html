<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071018">

<title>CalcPro - History</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:#05090e;
    color:#fff;
    font-family:Arial,sans-serif;
}

.app{
    min-height:100vh;
    background:#080f17;
}

.header{
    height:70px;
    padding:0 15px;

    display:flex;
    align-items:center;
    gap:13px;

    background:#091019;
    border-bottom:1px solid #223040;

    position:sticky;
    top:0;
    z-index:10;
}

.back{
    width:44px;
    height:44px;

    border:1px solid #29394a;
    border-radius:13px;

    background:#111b26;
    color:#fff;

    font-size:28px;
}

.title{
    font-size:21px;
    font-weight:800;
}

.title span{
    color:#00d4ed;
}

.main{
    width:100%;
    max-width:650px;

    margin:auto;
    padding:15px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:15px;
}

.count{
    color:#718193;
    font-size:11px;
}

.clear{
    border:1px solid #49303a;
    border-radius:11px;

    background:#21141a;
    color:#ff7180;

    padding:10px 13px;

    font-size:11px;
    font-weight:bold;

    position:relative;
    overflow:hidden;
}

.empty{
    padding:55px 20px;

    border:1px solid #253646;
    border-radius:22px;

    background:#0d1721;

    text-align:center;
}

.empty-icon{
    width:70px;
    height:70px;

    margin:0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:#142633;

    font-size:31px;
}

.empty h2{
    font-size:19px;
}

.empty p{
    margin-top:8px;

    color:#657687;

    font-size:11px;
    line-height:1.6;
}

.list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-item{
    padding:15px;

    border:1px solid #253646;
    border-radius:18px;

    background:#0d1721;

    animation:slideIn .3s ease;
}

@keyframes slideIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.item-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.mode{
    color:#00d4ed;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;
}

.time{
    color:#536476;
    font-size:9px;
}

.expression{
    margin-top:10px;

    color:#9baab8;

    font-size:15px;

    word-break:break-all;
}

.result{
    margin-top:7px;

    color:#fff;

    font-size:25px;
    font-weight:800;

    word-break:break-all;
}

.actions{
    display:flex;
    gap:8px;

    margin-top:12px;
}

.action{
    flex:1;

    min-height:38px;

    border:1px solid #293b4a;
    border-radius:10px;

    background:#111d28;
    color:#91a2b1;

    font-size:10px;

    position:relative;
    overflow:hidden;
}

.action:active{
    background:#172936;
}

.ripple{
    position:absolute;

    border-radius:50%;

    background:rgba(255,255,255,.16);

    transform:scale(0);

    animation:ripple .55s linear;

    pointer-events:none;
}

@keyframes ripple{

    to{
        transform:scale(4);
        opacity:0;
    }

}

</style>

</head>


<body>


<div class="app">


<header class="header">

<button
class="back"
onclick="history.back()">

‹

</button>

<div class="title">

Calc<span>Pro</span> History

</div>

</header>



<main class="main">


<div class="topbar">

<div
class="count"
id="count">

0 calculations

</div>

<button
class="clear"
onclick="clearAll()">

Clear All

</button>

</div>


<div
id="historyList"
class="list">
</div>


<div
id="empty"
class="empty">

<div class="empty-icon">
🕘
</div>

<h2>
No History Yet
</h2>

<p>
আপনার করা calculation এখানে
দেখানো হবে।
</p>

</div>


</main>


</div>



<script>

const HISTORY_KEY =
"calcpro_history";


/* Get history */

function getHistory(){

    try{

        const data =
        localStorage.getItem(
            HISTORY_KEY
        );

        const parsed =
        data ? JSON.parse(data) : [];

        return Array.isArray(parsed)
            ? parsed
            : [];

    }
    catch(error){

        return [];

    }

}


/* Save history */

function saveHistory(data){

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(data)
    );

}


/* Escape HTML */

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* Format time */

function formatTime(value){

    const date =
    new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }

    return date.toLocaleString();

}


/* Render */

function renderHistory(){

    const history =
    getHistory();

    const list =
    document.getElementById(
        "historyList"
    );

    const empty =
    document.getElementById(
        "empty"
    );

    const count =
    document.getElementById(
        "count"
    );

    count.textContent =
        history.length +
        (
            history.length === 1
            ? " calculation"
            : " calculations"
        );

    list.innerHTML = "";

    if(history.length === 0){

        empty.style.display =
            "block";

        return;

    }

    empty.style.display =
        "none";


    history.forEach(
        function(item,index){

            const card =
            document.createElement(
                "div"
            );

            card.className =
                "history-item";

            const mode =
                escapeHTML(
                    item.mode || "Calculator"
                );

            const expression =
                escapeHTML(
                    item.expression || ""
                );

            const result =
                escapeHTML(
                    item.result ?? ""
                );

            const time =
                formatTime(
                    item.time
                );

            card.innerHTML = `

                <div class="item-top">

                    <div class="mode">
                        ${mode}
                    </div>

                    <div class="time">
                        ${escapeHTML(time)}
                    </div>

                </div>

                <div class="expression">
                    ${expression}
                </div>

                <div class="result">
                    = ${result}
                </div>

                <div class="actions">

                    <button
                    class="action"
                    onclick="copyResult(${index})">

                    Copy Result

                    </button>

                    <button
                    class="action"
                    onclick="deleteItem(${index})">

                    Delete

                    </button>

                </div>

            `;

            list.appendChild(
                card
            );

        }
    );

}


/* Delete one */

function deleteItem(index){

    const history =
        getHistory();

    if(
        index < 0 ||
        index >= history.length
    ){

        return;

    }

    history.splice(
        index,
        1
    );

    saveHistory(history);

    renderHistory();

}


/* Delete all */

function clearAll(){

    const history =
        getHistory();

    if(history.length === 0){

        return;

    }

    const ok =
        confirm(
            "সব calculation history মুছে ফেলবেন?"
        );

    if(!ok){

        return;

    }

    localStorage.removeItem(
        HISTORY_KEY
    );

    renderHistory();

}


/* Copy */

async function copyResult(index){

    const history =
        getHistory();

    if(!history[index]){

        return;

    }

    const value =
        String(
            history[index].result ?? ""
        );

    try{

        await navigator.clipboard.writeText(
            value
        );

        alert(
            "Result copied!"
        );

    }
    catch(error){

        alert(
            "Copy করা যায়নি।"
        );

    }

}


/* Ripple */

document.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button"
            );

        if(!button){

            return;

        }

        const ripple =
            document.createElement(
                "span"
            );

        ripple.className =
            "ripple";

        const rect =
            button.getBoundingClientRect();

        const size =
            Math.max(
                rect.width,
                rect.height
            );

        ripple.style.width =
            size + "px";

        ripple.style.height =
            size + "px";

        ripple.style.left =
            (
                event.clientX -
                rect.left -
                size / 2
            ) + "px";

        ripple.style.top =
            (
                event.clientY -
                rect.top -
                size / 2
            ) + "px";

        button.appendChild(
            ripple
        );

        setTimeout(
            () => ripple.remove(),
            600
        );

    }
);


/* Start */

renderHistory();

</script>

</body>

</html>
