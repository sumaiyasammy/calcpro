<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#071018">

<title>CalcPro - Offline</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
    radial-gradient(
        circle at top,
        #102535 0%,
        #071018 45%,
        #04070b 100%
    );

    color:#fff;

    font-family:
    Arial,
    sans-serif;
}

.container{
    width:100%;
    max-width:420px;

    text-align:center;

    padding:35px 25px;

    border:1px solid #243747;

    border-radius:28px;

    background:
    rgba(12,22,32,.92);

    box-shadow:
    0 25px 70px rgba(0,0,0,.45);

    position:relative;

    overflow:hidden;
}

.container::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-100px;
    right:-80px;

    border-radius:50%;

    background:
    rgba(0,210,240,.12);
}

.icon{
    width:90px;
    height:90px;

    margin:0 auto 22px;

    border-radius:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #00c9e8,
        #5367ff
    );

    font-size:46px;

    font-weight:900;

    box-shadow:
    0 12px 35px rgba(0,180,230,.2);
}

h1{
    font-size:28px;

    margin-bottom:10px;
}

h1 span{
    color:#00d4ed;
}

.subtitle{
    color:#8190a0;

    font-size:14px;

    line-height:1.6;

    margin-bottom:25px;
}

.status{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    margin-bottom:25px;

    color:#a8b5c2;

    font-size:13px;
}

.dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#ffb34d;

    box-shadow:
    0 0 12px rgba(255,179,77,.6);

    animation:pulse 1.4s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.45;
        transform:scale(.75);
    }

}

.retry{
    width:100%;

    height:54px;

    border:0;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #00b9da,
        #5965ff
    );

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    position:relative;

    overflow:hidden;

    transition:
    transform .15s;
}

.retry:active{
    transform:scale(.95);
}

.ripple{
    position:absolute;

    border-radius:50%;

    background:
    rgba(255,255,255,.25);

    transform:scale(0);

    animation:ripple .55s linear;

    pointer-events:none;
}

@keyframes ripple{

    to{
        transform:scale(4);

        opacity:0;
    }

}

.tip{
    margin-top:20px;

    color:#596979;

    font-size:11px;

    line-height:1.5;
}

</style>

</head>


<body>


<div class="container">


<div class="icon">
=
</div>


<h1>
Calc<span>Pro</span>
</h1>


<p class="subtitle">

আপনি বর্তমানে অফলাইনে আছেন।<br>

ইন্টারনেট সংযোগ না থাকলেও Calculator-এর
বেসিক ফিচারগুলো ব্যবহার করা যাবে।

</p>


<div class="status">

<span class="dot"></span>

<span id="status">
Offline Mode
</span>

</div>


<button
class="retry"
onclick="checkConnection()">

↻ &nbsp; Try Again

</button>


<p class="tip">

ইন্টারনেট সংযোগ ফিরে এলে
“Try Again” চাপুন।

</p>


</div>



<script>

function checkConnection(){

    if(navigator.onLine){

        window.location.href =
        "index.html";

    }
    else{

        document
        .getElementById("status")
        .textContent =
        "Still Offline";

    }

}


/* Online হলে automatically ফিরে যাবে */

window.addEventListener(
"online",
function(){

    document
    .getElementById("status")
    .textContent =
    "Connection Restored";

    setTimeout(
        () => {
            window.location.href =
            "index.html";
        },
        700
    );

});


/* Ripple animation */

document.addEventListener(
"click",
function(event){

    const button =
    event.target.closest(
        "button"
    );

    if(!button){
        return;
    }

    const ripple =
    document.createElement(
        "span"
    );

    ripple.className =
    "ripple";

    const rect =
    button.getBoundingClientRect();

    const size =
    Math.max(
        rect.width,
        rect.height
    );

    ripple.style.width =
    size + "px";

    ripple.style.height =
    size + "px";

    ripple.style.left =
    (
        event.clientX -
        rect.left -
        size / 2
    ) + "px";

    ripple.style.top =
    (
        event.clientY -
        rect.top -
        size / 2
    ) + "px";

    button.appendChild(
        ripple
    );

    setTimeout(
        () => ripple.remove(),
        600
    );

});

</script>


</body>

</html>
