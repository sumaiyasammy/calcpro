<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071018">

<title>CalcPro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#05090e;
    color:white;
}

.launch{
    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at center,
        #102738 0%,
        #071018 42%,
        #04070b 100%
    );

    position:relative;
    overflow:hidden;
}

.glow{
    position:absolute;

    width:280px;
    height:280px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(0,210,240,.18),
        transparent 70%
    );

    animation:glow 2.5s ease-in-out infinite;
}

@keyframes glow{
    0%,100%{
        transform:scale(.9);
        opacity:.55;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }
}

.content{
    position:relative;
    z-index:2;

    text-align:center;
}

.logo{
    width:105px;
    height:105px;

    margin:0 auto 25px;

    border-radius:29px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #00c9e8,
        #5367ff
    );

    font-size:55px;
    font-weight:900;

    box-shadow:
    0 20px 60px rgba(0,180,230,.28);

    animation:
    logoIn .8s ease-out;
}

@keyframes logoIn{
    from{
        opacity:0;
        transform:scale(.5) rotate(-15deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

h1{
    font-size:36px;
    font-weight:900;
    letter-spacing:-1px;

    animation:
    textIn .8s .2s both;
}

h1 span{
    color:#00d4ed;
}

.subtitle{
    margin-top:8px;

    color:#718396;

    font-size:13px;

    animation:
    textIn .8s .35s both;
}

@keyframes textIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.loader{
    width:190px;
    height:4px;

    margin:30px auto 0;

    border-radius:20px;

    background:#182532;

    overflow:hidden;
}

.loader-bar{
    width:0;
    height:100%;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #00c9e8,
        #5367ff
    );

    animation:
    loading 2.4s linear forwards;
}

@keyframes loading{
    from{
        width:0;
    }

    to{
        width:100%;
    }
}

.status{
    margin-top:12px;

    color:#526477;

    font-size:10px;

    animation:
    textIn .8s .5s both;
}

.footer{
    position:absolute;

    bottom:20px;
    left:0;
    right:0;

    text-align:center;

    color:#394858;

    font-size:9px;
}

@media(max-width:390px){

    .logo{
        width:92px;
        height:92px;
        font-size:48px;
    }

    h1{
        font-size:32px;
    }

}
</style>
</head>

<body>

<div class="launch">

    <div class="glow"></div>

    <div class="content">

        <div class="logo">
            =
        </div>

        <h1>
            Calc<span>Pro</span>
        </h1>

        <div class="subtitle">
            Smart Professional Calculator
        </div>

        <div class="loader">
            <div class="loader-bar"></div>
        </div>

        <div class="status">
            Preparing Calculator...
        </div>

    </div>

    <div class="footer">
        CalcPro • Version 1.0.0
    </div>

</div>

<script>

setTimeout(function(){

    const defaultCalc =
        localStorage.getItem(
            "calcpro_default_calculator"
        ) || "index.html";

    window.location.href =
        defaultCalc;

},2600);

</script>

</body>
</html>
